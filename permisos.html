<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mis permisos</title>

    <link
        rel="stylesheet"
        href="permisos.css">

</head>

<body>


    <!-- BARRA SUPERIOR -->

    <header class="barra-superior">

        <div class="logo">

            <div class="logo-icono">
                📋
            </div>

            <div class="logo-texto">

                <h1>
                    Sistema de Permisos
                </h1>

                <p>
                    Mis permisos
                </p>

            </div>

        </div>

    </header>


    <!-- CONTENIDO -->

    <main class="contenedor">

        <section class="encabezado">

            <h2>
                Mis permisos
            </h2>

            <p>
                Aquí puedes consultar tus solicitudes.
            </p>

        </section>


        <!-- LISTA -->

        <section id="listaPermisos">

        </section>


        <!-- SIN PERMISOS -->

        <div
            id="sinPermisos"
            class="sin-permisos">

            No tienes solicitudes de permisos
            registradas.

        </div>


        <button
            type="button"
            class="boton-volver"
            id="btnVolver">

            ← Volver

        </button>

    </main>


    <script src="permisos.js"></script>

</body>

</html>
