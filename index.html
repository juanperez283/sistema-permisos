<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Permisos Virtuales</title>
    <link rel="stylesheet" href="sesion.css">
</head>

<body>

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <!-- ENCABEZADO -->

            <div class="encabezado">

                <div class="icono">
                    📋
                </div>

                <h1>
                    Sistema de Permisos
                </h1>

                <p>
                    Plataforma de permisos virtuales
                </p>

            </div>


            <!-- SELECCIÓN DE ROL -->

            <div class="seccion-roles">

                <h2>
                    Selecciona tu tipo de usuario
                </h2>

                <div class="roles">

                    <button
                        type="button"
                        class="boton-rol activo">

                        👨‍🎓
                        <span>Estudiante</span>

                    </button>


                    <button
                        type="button"
                        class="boton-rol">

                        👨‍🏫
                        <span>Profesor</span>

                    </button>


                    <button
                        type="button"
                        class="boton-rol">

                        👨‍💼
                        <span>Administrador</span>

                    </button>

                </div>

            </div>


            <!-- FORMULARIO -->

            <form class="formulario-login">

                <div class="campo">

                    <label for="correo">
                        Correo institucional
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@colegio.edu"
                        required>

                </div>


                <div class="campo">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        required>

                </div>


                <button
                    type="submit"
                    class="boton-iniciar">

                    Iniciar sesión

                </button>

            </form>


            <!-- INFORMACIÓN -->

            <div class="informacion">

                <span>🔒</span>

                <p>
                    Acceso exclusivo para usuarios
                    autorizados de la institución.
                </p>

            </div>


            <!-- PIE -->

            <footer>

                Sistema de Permisos Virtuales

            </footer>

        </section>

    </main>

</body>
<script src="sesion.js"></script>
</html>
